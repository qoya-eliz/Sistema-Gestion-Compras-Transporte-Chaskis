<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar"
       class="app-sidebar"
       id="appSidebar">

    <div>

        <div class="sidebar-header">

            <a th:href="@{/supervisor/dashboard}"
               class="brand-container">

                <div class="brand-logo-icon">

                    <img th:src="@{/img/logo-icono.png}"
                         alt="Los Chaskis"
                         class="brand-logo-img">

                </div>

                <div>

                    <div class="brand-text-title">
                        Los <span>Chaskis</span>
                    </div>

                    <span class="brand-text-slogan">
                        Operaciones de Terminal
                    </span>

                </div>

            </a>

        </div>


        <ul class="sidebar-nav">

            <li class="sidebar-nav-item">

                <a th:href="@{/supervisor/dashboard}"
                   class="sidebar-nav-link">

                    <i class="bi bi-speedometer2"></i>

                    <span>
                        Panel Operativo
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/supervisor/embarque}"
                   class="sidebar-nav-link">

                    <i class="bi bi-person-check-fill"></i>

                    <span>
                        Embarque / Abordaje
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/supervisor/plano-asientos}"
                   class="sidebar-nav-link">

                    <i class="bi bi-grid-3x3-gap"></i>

                    <span>
                        Plano de Asientos
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item mt-3">

                <a th:href="@{/login}"
                   class="sidebar-nav-link">

                    <i class="bi bi-box-arrow-left"></i>

                    <span>
                        Cerrar Sesión
                    </span>

                </a>

            </li>

        </ul>

    </div>


    <div class="sidebar-user">

        <div class="user-avatar-wrap">

            <div class="user-avatar-img">
                SU
            </div>

            <div class="user-status-dot"></div>

        </div>


        <div>

            <div class="user-info-name">
                Supervisor
            </div>

            <div class="user-info-role">
                Operaciones
            </div>

            <div class="user-info-status">

                <i class="bi bi-geo-alt-fill"></i>

                Terminal Piura

            </div>

        </div>

    </div>

</aside>

</body>
</html>
