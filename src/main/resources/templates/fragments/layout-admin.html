<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar"
       class="app-sidebar"
       id="appSidebar">

    <div>

        <div class="sidebar-header">

            <a th:href="@{/admin/dashboard}"
               class="brand-container">

                <div class="brand-logo-icon">

                    <img th:src="@{/img/logo-icono.png}"
                         alt="Los Chaskis"
                         class="brand-logo-img">

                </div>

                <div>

                    <div class="brand-text-title">
                        Los <span>Chaskis</span>
                    </div>

                    <span class="brand-text-slogan">
                        Conectando caminos,
                        uniendo destinos
                    </span>

                </div>

            </a>

        </div>


        <ul class="sidebar-nav">

            <li class="sidebar-nav-item">

                <a th:href="@{/admin/dashboard}"
                   class="sidebar-nav-link">

                    <i class="bi bi-speedometer2"></i>

                    <span>
                        Dashboard / Reportes
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/admin/buses}"
                   class="sidebar-nav-link">

                    <i class="bi bi-bus-front"></i>

                    <span>
                        Gestión de Flota
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/admin/choferes}"
                   class="sidebar-nav-link">

                    <i class="bi bi-person-vcard"></i>

                    <span>
                        Gestión de Choferes
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/admin/rutas}"
                   class="sidebar-nav-link">

                    <i class="bi bi-map"></i>

                    <span>
                        Catálogo de Rutas
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/admin/viajes}"
                   class="sidebar-nav-link">

                    <i class="bi bi-signpost-2"></i>

                    <span>
                        Rutas e Itinerarios
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/admin/reportes}"
                   class="sidebar-nav-link">

                    <i class="bi bi-bar-chart-line"></i>

                    <span>
                        Reportes Estadísticos
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item mt-3">

                <a th:href="@{/}"
                   target="_blank"
                   class="sidebar-nav-link">

                    <i class="bi bi-globe2"></i>

                    <span>
                        Portal Público

                        <i class="bi bi-box-arrow-up-right ms-1 small"></i>
                    </span>

                </a>

            </li>


            <li class="sidebar-nav-item">

                <a th:href="@{/login}"
                   class="sidebar-nav-link">

                    <i class="bi bi-box-arrow-left"></i>

                    <span>
                        Cerrar Sesión
                    </span>

                </a>

            </li>

        </ul>

    </div>


    <div class="sidebar-user">

        <div class="user-avatar-wrap">

            <div class="user-avatar-img">
                AD
            </div>

            <div class="user-status-dot"></div>

        </div>


        <div>

            <div class="user-info-name">
                Administrador
            </div>

            <div class="user-info-role">
                Administrador General
            </div>

            <div class="user-info-status">

                <i class="bi bi-circle-fill"
                   style="font-size:0.4rem;"></i>

                En línea

            </div>

        </div>

    </div>

</aside>

</body>
</html>
